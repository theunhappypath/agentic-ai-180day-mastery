# The lab's settings. Every model call made through `agentic_mastery.lab` reads this file.
# Nothing is left to a tool's hidden default: if a setting matters, it is written here,
# sent with every request, and saved in the log next to the result.
#
# Change a value here, or override it for one call: `uv run lab ask --num-ctx 16384 "..."`.

[log]
# Append-only, one JSON line per model call (schema from Day 1). Relative to this file.
path = "costs.jsonl"

[defaults]
provider = "ollama"            # "ollama" (local, free) or "anthropic" (needs ANTHROPIC_API_KEY)
model = "qwen2.5:7b-instruct"
temperature = 0.0              # Day 3: 0 = always pick the most likely token
seed = 42                      # Day 3: same seed, same dice (Ollama only)
num_ctx = 8192                 # Day 4: the model's desk, in tokens. Always sent, never guessed.
max_tokens = 512               # the most the model may write per answer

[ollama]
url = "http://localhost:11434"
keep_alive = "15m"             # keep the model loaded between calls

# Ollama model tag -> the Hugging Face repo with the same tokenizer (Day 1). With a match,
# the lab counts the tokens it sends exactly and can tell when the model read fewer.
[tokenizers]
"qwen2.5:7b-instruct" = "Qwen/Qwen2.5-7B-Instruct"
"qwen2.5:7b" = "Qwen/Qwen2.5-7B"
"llama3.1:8b" = "meta-llama/Llama-3.1-8B-Instruct"
"llama3.1:latest" = "meta-llama/Llama-3.1-8B-Instruct"
"llama3.2:3b" = "meta-llama/Llama-3.2-3B-Instruct"
"llama3.2:latest" = "meta-llama/Llama-3.2-3B-Instruct"
